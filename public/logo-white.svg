<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Top Diamond -->
  <polygon points="50,10 90,30 50,50 10,30" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Left Wall Outline -->
  <polyline points="10,30 10,60 50,80" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Wall Outline -->
  <polyline points="90,30 90,60 50,80" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Vertical Line -->
  <!-- <line x1="50" y1="50" x2="50" y2="80" stroke="white" stroke-width="4" stroke-linecap="round"/> -->
  
  <!-- Colored Pillars -->
  <!-- Red -->
  <polygon points="25,48 32,51 32,70 25,66" fill="#e53935"/>
  <!-- Blue -->
  <polygon points="40,55 47,58 47,77 40,73" fill="#1e88e5"/>
  <!-- Green -->
  <polygon points="55,55 62,51 62,70 55,74" fill="#43a047"/>
  <!-- Yellow -->
  <polygon points="70,48 77,44 77,63 70,67" fill="#fdd835"/>
</svg>
